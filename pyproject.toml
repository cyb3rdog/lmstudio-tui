[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lmstudio-tui"
version = "0.2.0"
description = "Terminal UI for managing, monitoring, chatting with, and benchmarking LM Studio servers"
readme = {content-type = "text/markdown", file = "README.md"}
keywords = ["lm-studio", "llm", "tui", "terminal", "benchmark", "chat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Terminals",
]
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "tomli-w>=1.0.0",
]

[project.scripts]
lmstudio-tui = "lmstudio_tui.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lmstudio_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
